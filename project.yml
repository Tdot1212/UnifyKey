name: UnifyKey
options:
  bundleIdPrefix: com.unifykey
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: Y9WMMP3XCZ
    CODE_SIGN_STYLE: Automatic

targets:
  UnifyKey:
    type: application
    platform: iOS
    sources:
      - path: UnifyKey
        type: group
      - path: Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unifykey.app
        INFOPLIST_FILE: UnifyKey/Info.plist
        CODE_SIGN_ENTITLEMENTS: UnifyKey/UnifyKey.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: UnifyKeyboard

  UnifyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: UnifyKeyboard
        type: group
      - path: Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unifykey.app.keyboard
        INFOPLIST_FILE: UnifyKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: UnifyKeyboard/UnifyKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1

schemes:
  UnifyKey:
    build:
      targets:
        UnifyKey: all
        UnifyKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
